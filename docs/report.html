<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustLink — Verification Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath d='M50 18 L76 30 V52 C76 68 64 78 50 84 C36 78 24 68 24 52 V30 Z' fill='white'/%3E%3Cpath d='M40 52 L47 59 L62 42' stroke='%233b82f6' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#020617;--blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--red:#ef4444;--orange:#f97316;
--text:#e2e8f0;--muted:#94a3b8;--card:rgba(30,41,59,.6);--border:rgba(148,163,184,.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.18;pointer-events:none;}
.orb.a{width:440px;height:440px;background:linear-gradient(90deg,#2563eb,#06b6d4);top:-90px;left:-100px;animation:dr 10s ease-in-out infinite;}
.orb.b{width:420px;height:420px;background:linear-gradient(90deg,#9333ea,#ec4899);bottom:-100px;right:-100px;animation:dr 12s ease-in-out infinite reverse;}
@keyframes dr{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,40px) scale(1.12);}}
.card{position:relative;z-index:2;background:var(--card);border:1px solid var(--border);border-radius:26px;padding:40px 36px;max-width:520px;width:100%;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:up .6s both;text-align:center;}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.97);}to{opacity:1;transform:none;}}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:17px;margin-bottom:6px;}
.logo .s{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:14px;}
.logo span{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;}
.rtitle{font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:26px;}
.ring{width:150px;height:150px;position:relative;margin:0 auto 14px;}
.ring svg{transform:rotate(-90deg);}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .n b{font-size:38px;font-weight:900;}
.ring .n span{font-size:9.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.verdict{font-size:19px;font-weight:900;margin-bottom:4px;}
.vname{font-size:23px;font-weight:900;margin:18px 0 2px;}
.vdoc{color:var(--muted);font-size:14px;margin-bottom:22px;}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:20px 0;}
.pt{background:rgba(148,163,184,.06);border:1px solid var(--border);border-radius:13px;padding:13px 8px;}
.pt b{font-size:18px;display:block;}
.pt span{font-size:9.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.meta{font-size:12.5px;color:var(--muted);line-height:1.9;border-top:1px solid var(--border);padding-top:18px;margin-top:6px;}
.meta b{color:var(--text);}
.sig{display:inline-flex;align-items:center;gap:7px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;font-size:11.5px;font-weight:700;padding:7px 14px;border-radius:40px;margin-top:14px;letter-spacing:.5px;}
.sig.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5;}
.err{padding:30px 10px;}
.err .e{font-size:44px;margin-bottom:14px;}
.err p{color:var(--muted);line-height:1.7;}
.foot{margin-top:22px;font-size:11.5px;color:var(--muted);}
.foot a{color:#60a5fa;font-weight:700;text-decoration:none;}
.btnrow{margin-top:20px;}
.btn{padding:11px 22px;border-radius:11px;font-weight:700;font-size:13px;border:1px solid var(--border);background:rgba(148,163,184,.1);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;gap:7px;transition:.3s;}
.btn:hover{border-color:var(--cyan);transform:translateY(-2px);}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="card" id="card">
  <div class="logo"><span class="s">🛡️</span>Trust<span>Link</span></div>
  <div class="rtitle">Identity Verification Report</div>
  <div id="content"><div class="err"><div class="e">⏳</div><p>Reading report…</p></div></div>
  <div class="foot">Built by <a href="https://manideep-2006.github.io/my-portfolio/" target="_blank">Sai Kiran Manideep</a> · <a href="app.html">Verify yourself →</a></div>
</div>
<script>
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function ub64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))));}
(async()=>{
  const C=document.getElementById('content');
  try{
    const h=location.hash.slice(1);
    if(!h)throw new Error('No report data in URL. Scan a TrustLink QR code to view a report.');
    const d=ub64(h);
    const expect=(await sha256(JSON.stringify([d.id,d.name,d.score,d.ts])+'TLDEMO')).slice(0,16);
    const sigOk=expect===d.sig;
    const col=d.score>=75?'#10b981':d.score>=50?'#f97316':'#ef4444';
    const CIRC=2*Math.PI*62;
    C.innerHTML=`
      <div class="ring"><svg width="150" height="150">
        <circle cx="75" cy="75" r="62" stroke="rgba(148,163,184,.13)" stroke-width="11" fill="none"/>
        <circle id="arc" cx="75" cy="75" r="62" stroke="${col}" stroke-width="11" fill="none" stroke-linecap="round"
          stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg>
        <div class="n"><b id="num" style="color:${col}">0</b><span>Trust Score</span></div></div>
      <div class="verdict" style="color:${col}">${d.verdict}</div>
      <div class="vname">${d.name}</div>
      <div class="vdoc">${d.doc} ending ····${d.last4}</div>
      <div class="parts">
        <div class="pt"><b>${d.parts.doc}/30</b><span>Document</span></div>
        <div class="pt"><b>${d.parts.ocr}/40</b><span>OCR Match</span></div>
        <div class="pt"><b>${d.parts.face}/30</b><span>Face Match</span></div>
      </div>
      <div class="meta">
        <b>Report ID:</b> ${d.id}<br>
        <b>Verified on:</b> ${new Date(d.ts).toLocaleString()}<br>
        <b>Biometric:</b> ${d.face||'—'}
      </div>
      <div class="sig ${sigOk?'':'bad'}">${sigOk?'🔏 Signature valid — report is authentic':'⚠ Signature mismatch — data may be tampered'}</div>
      <div class="btnrow"><button class="btn" onclick="window.print()">🖨 Print / Save PDF</button></div>`;
    setTimeout(()=>{
      const a=document.getElementById('arc');
      a.style.transition='stroke-dashoffset 1.5s cubic-bezier(.2,.7,.3,1)';
      a.style.strokeDashoffset=CIRC-(CIRC*d.score/100);
      const n=document.getElementById('num'),t0=performance.now();
      (function tk(t){const p=Math.min(1,(t-t0)/1500);n.textContent=Math.round(d.score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tk);})(t0);
    },200);
  }catch(e){
    C.innerHTML='<div class="err"><div class="e">❌</div><p>'+e.message+'</p></div>';
  }
})();
</script>
</body>
</html>
